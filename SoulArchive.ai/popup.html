<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>SoulArchive.AI</title>
  <style>
    body {
      width: 200px;
      padding: 8px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      text-align: center;
      background-color: #f7f7f8;
    }

    button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 0;
      font-size: 14px;
      cursor: pointer;
      background-color: #448aff;
      color: white;
      border: none;
      border-radius: 6px;
      width: 100%;
      transition: background-color 0.2s;
    }

    button img {
      width: 16px;
      height: 16px;
      filter: brightness(0) invert(1);
    }

    button:hover {
      background-color: #1a73e8;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #2f2f2f;
      }
    }
  </style>
</head>

<body>
  <button id="saveBtn"><img src="assets/icn_download.svg" alt="">Export</button>
  <script src="popup.js"></script>
</body>

</html>
